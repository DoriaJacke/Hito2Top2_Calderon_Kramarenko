# Nombres de archivos en ./certs (AWS IoT). Si renombrás a AmazonRootCA1.pem,
# certificate.pem.crt y private.pem.key, podés quitar estas tres variables.
x-aws-iot-tls: &aws-iot-tls
  AWS_IOT_ENDPOINT: a2apsmaa0mdv52-ats.iot.us-east-1.amazonaws.com
  CERT_DIR: /app/certs
  AWS_IOT_CA_FILE: "AmazonRootCA1 (1).pem"
  AWS_IOT_CERT_FILE: "9815564b6b3efa85dfe4870333e06e90b073c1f6e71b9165985ec0507b10cf28-certificate.pem.crt"
  AWS_IOT_KEY_FILE: "9815564b6b3efa85dfe4870333e06e90b073c1f6e71b9165985ec0507b10cf28-private.pem.key"

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongodb_exporter:
    image: percona/mongodb_exporter:0.42.0
    command:
      - '--mongodb.uri=mongodb://mongodb:27017'
      - '--compatible-mode'
      # Sin --collector.collstats el exporter solo expone mongodb_up (por eso Grafana: No data)
      - '--collector.collstats'
      - '--mongodb.collstats-colls=agro_iot.lecturas'
    ports:
      - "9216:9216"
    depends_on:
      - mongodb
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    depends_on:
      - subscriber
      - mongodb_exporter
    restart: on-failure

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: on-failure

  rest_api:
    build: ./rest_api
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    restart: on-failure

  subscriber:
    build: ./mqtt_client
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    restart: on-failure
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      MQTT_TOPIC_SUBSCRIBE: mina/zona_sur_calderon_kramarenko/#
      METRICS_PORT: "8000"
    volumes:
      - ./certs:/app/certs:ro

  # Tópico MQTT: mina/zona_sur_calderon_kramarenko/<SENSOR_NAME>
  sensor_temperatura_ambiente:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: temperatura_ambiente
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_humedad_relativa:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: humedad_relativa
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_vibracion:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: vibracion
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_toneladas_hora:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: toneladas_hora
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_ciclos_completados:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: ciclos_completados
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_ph:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: ph
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_co2:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: co2
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_so2:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: so2
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor_material_particulado:
    build: ./sensors
    environment:
      <<: *aws-iot-tls
      MQTT_ZONE: zona_sur_calderon_kramarenko
      SENSOR_NAME: material_particulado
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - rest_api

volumes:
  mongo_data:
