version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rest_api:
    build: ./rest_api
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    restart: on-failure

  subscriber:
    build: ./mqtt_client
    depends_on:
      - mongodb
    restart: on-failure
    environment:
      - AWS_IOT_ENDPOINT=a2apsmaa0mdv52-ats.iot.us-east-1.amazonaws.com
      - CERT_DIR=/app/certs
    volumes:
      - ./certs:/app/certs:ro

  sensor1:
    build: ./sensors
    environment:
      - SENSOR_ID=1
      - AWS_IOT_ENDPOINT=a2apsmaa0mdv52-ats.iot.us-east-1.amazonaws.com
      - CERT_DIR=/app/certs
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  sensor2:
    build: ./sensors
    environment:
      - SENSOR_ID=2
      - AWS_IOT_ENDPOINT=a2apsmaa0mdv52-ats.iot.us-east-1.amazonaws.com
      - CERT_DIR=/app/certs
    restart: on-failure
    volumes:
      - ./certs:/app/certs:ro

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - rest_api

volumes:
  mongo_data:
