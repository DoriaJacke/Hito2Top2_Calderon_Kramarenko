global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: mqtt_subscriber
    metrics_path: /metrics
    static_configs:
      - targets: ["subscriber:8000"]

  - job_name: mongodb_exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["mongodb_exporter:9216"]
